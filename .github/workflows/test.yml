name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-version: ['stable', 'nightly']

    steps:
    - uses: actions/checkout@v4

    - name: Install Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ matrix.nvim-version }}

    - name: Install Pandoc
      run: |
        wget https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-1-amd64.deb
        sudo dpkg -i pandoc-3.1.11-1-amd64.deb

    - name: Verify Pandoc installation
      run: pandoc --version

    - name: Install StyLua (optional)
      run: |
        wget -qO- https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip | sudo funzip > /usr/local/bin/stylua
        sudo chmod +x /usr/local/bin/stylua || true

    - name: Run StyLua check
      run: stylua --check . || echo "StyLua not available or check failed, continuing..."
      continue-on-error: true

    - name: Run smoke test
      run: |
        nvim --headless --noplugin -u NONE \
          -c "set runtimepath+=." \
          -c "lua require('writing-metrics')" \
          -c "quit"

    - name: Run tests (if plenary available)
      run: |
        nvim --headless --noplugin -u tests/minimal_init.lua \
          -c "PlenaryBustedDirectory tests/" || echo "Tests require plenary.nvim"
      continue-on-error: true
